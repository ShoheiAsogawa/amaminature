<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <!-- 龍郷柄（docs/DESIGN_SYSTEM.md §6）。40×40 のタイルを繰り返す。地は透明にしてあり、
       使う側が brand-fill（ライト #1E50A2 / 夜の森 #4057A3）を敷く。
       図鑑カードの裏面と、共有画像の「幻」の外周だけに使う。 -->
  <g fill="none" stroke="white" stroke-opacity="0.28" stroke-width="3" stroke-dasharray="3 2">
    <!-- 中央の菱形の輪郭（絣のかすれ） -->
    <path d="M20 4 L36 20 L20 36 L4 20 Z"/>
    <!-- 四隅の 4 分の 1 の菱形（隣のタイルとつながって 1 つの菱形になる） -->
    <path d="M16 0 L0 16"/>
    <path d="M24 0 L40 16"/>
    <path d="M0 24 L16 40"/>
    <path d="M40 24 L24 40"/>
  </g>
  <!-- 内側の塗りの菱形 -->
  <path d="M20 13 L27 20 L20 27 L13 20 Z" fill="white" fill-opacity="0.5"/>
</svg>
